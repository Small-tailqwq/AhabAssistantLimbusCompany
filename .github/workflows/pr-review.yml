name: PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number

concurrency:
  group: opencode-pr-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  OPENCODE_VERSION: "1.18.1"

jobs:
  automatic-review:
    if: |
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve pull request context
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            let pullNumber;
            if (context.eventName === 'pull_request_target') {
              pullNumber = context.payload.pull_request.number;
            } else if (context.eventName === 'workflow_dispatch') {
              pullNumber = Number(context.payload.inputs.pr_number);
            } else {
              pullNumber = context.issue.number;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            core.setOutput('pr_number', String(pull.number));
            core.setOutput('base_sha', pull.base.sha);
            core.setOutput('head_sha', pull.head.sha);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull.number,
              per_page: 100,
            });
            const priorReview = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes('<!-- opencode-pr-review -->')
            );
            const metadataPath = path.join(process.env.RUNNER_TEMP, 'pr-review-metadata.json');
            fs.writeFileSync(metadataPath, JSON.stringify({
              number: pull.number,
              title: pull.title,
              prior_review: priorReview?.body || '',
            }));
            core.setOutput('metadata_path', metadataPath);

      # pull_request_target can access repository secrets. Never check out or execute
      # code from the untrusted PR head in this job.
      - name: Checkout trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR head as data only
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        run: |
          git fetch --no-tags origin \
            "+pull/${PR_NUMBER}/head:refs/remotes/opencode/pr-head"
          actual_head_sha=$(git rev-parse refs/remotes/opencode/pr-head)
          if [ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "PR head moved during context setup: expected $EXPECTED_HEAD_SHA, got $actual_head_sha" >&2
            exit 1
          fi

      - name: Build bounded review context
        run: |
          python scripts/build_pr_review_context.py \
            --base HEAD \
            --head refs/remotes/opencode/pr-head \
            --metadata "${{ steps.context.outputs.metadata_path }}" \
            --output logs/ci/pr-review-context.md

      - name: Cache OpenCode
        id: cache-opencode
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ env.OPENCODE_VERSION }}

      - name: Install pinned OpenCode
        if: steps.cache-opencode.outputs.cache-hit != 'true'
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version "${OPENCODE_VERSION}"

      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Validate review agent discovery
        run: opencode --pure debug agent pr-review | jq -e '.mode == "primary"'

      - name: Run read-only OpenCode review
        id: review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          OPENCODE_CONFIG_CONTENT: |
            {
              "provider": {
                "opencode-go": {
                  "name": "OpenCode Go",
                  "npm": "@ai-sdk/openai-compatible",
                  "options": {
                    "baseURL": "https://opencode.ai/zen/go/v1",
                    "apiKey": "{env:DEEPSEEK_API_KEY}"
                  },
                  "models": {
                    "deepseek-v4-pro": {
                      "name": "DeepSeek V4 Pro"
                    }
                  }
                }
              }
            }
        run: |
          set +e
          opencode --pure run \
            -m opencode-go/deepseek-v4-pro \
            --agent pr-review \
            --file logs/ci/pr-review-context.md \
            --title "PR #${PR_NUMBER} review @ ${HEAD_SHA}" \
            "Review PR #${PR_NUMBER} from ${BASE_SHA} to ${HEAD_SHA}. Use only the attached trusted CI context and the pr-review agent workflow. Return only the final Chinese Markdown report." \
            > logs/ci/opencode-review.md \
            2> logs/ci/opencode-review.stderr.log
          exit_code=$?
          set -e

          if [ ! -s logs/ci/opencode-review.md ]; then
            printf '## OpenCode PR 审阅\n\n审阅进程未生成报告，请检查工作流日志与附件。\n' \
              > logs/ci/opencode-review.md
            if [ "$exit_code" -eq 0 ]; then
              exit_code=1
            fi
          fi
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-pr-review-${{ steps.context.outputs.pr_number }}-${{ github.run_id }}
          path: logs/ci/
          if-no-files-found: error
          retention-days: 7

      - name: Publish sticky review report
        if: always() && steps.context.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          REVIEW_EXIT_CODE: ${{ steps.review.outputs.exit_code }}
          REVIEW_PATH: logs/ci/opencode-review.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- opencode-pr-review -->';
            const pullNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            const exitCode = process.env.REVIEW_EXIT_CODE || 'not-run';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const stripAnsi = (text) => text.replace(/\u001b\[[0-?]*[ -\/]*[@-~]/g, '');

            let report = '审阅进程未生成可读取的报告。';
            if (fs.existsSync(process.env.REVIEW_PATH)) {
              report = stripAnsi(fs.readFileSync(process.env.REVIEW_PATH, 'utf8')).trim();
            }
            if (report.length > 56000) {
              report = `${report.slice(0, 56000)}\n\n[报告已截断；完整输出见工作流附件]`;
            }

            const status = exitCode === '0'
              ? 'OpenCode 已完成只读审阅。'
              : `⚠️ OpenCode 审阅未正常完成（exit ${exitCode}）。`;
            const body = [
              marker,
              report,
              '',
              `---\n${status} Head: \`${headSha}\` · [工作流记录](${runUrl})`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body,
              });
            }

      - name: Fail when OpenCode did not complete
        if: always() && steps.review.outputs.exit_code != '0'
        env:
          REVIEW_EXIT_CODE: ${{ steps.review.outputs.exit_code }}
        run: exit "${REVIEW_EXIT_CODE:-1}"

  opencode-comment:
    if: |
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
       github.event_name == 'pull_request_review_comment') &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Cache OpenCode
        id: cache-opencode
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ env.OPENCODE_VERSION }}

      - name: Install pinned OpenCode
        if: steps.cache-opencode.outputs.cache-hit != 'true'
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version "${OPENCODE_VERSION}"

      - name: Add OpenCode to PATH
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Validate review agent discovery
        run: opencode --pure debug agent pr-comment | jq -e '.mode == "primary"'

      - name: Run OpenCode GitHub comment workflow
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: opencode-go/deepseek-v4-pro
          AGENT: pr-comment
          SHARE: "false"
          USE_GITHUB_TOKEN: "true"
          MENTIONS: "/opencode,/oc"
          OPENCODE_CONFIG_CONTENT: |
            {
              "provider": {
                "opencode-go": {
                  "name": "OpenCode Go",
                  "npm": "@ai-sdk/openai-compatible",
                  "options": {
                    "baseURL": "https://opencode.ai/zen/go/v1",
                    "apiKey": "{env:DEEPSEEK_API_KEY}"
                  },
                  "models": {
                    "deepseek-v4-pro": {
                      "name": "DeepSeek V4 Pro"
                    }
                  }
                }
              }
            }
        run: opencode --pure github run
