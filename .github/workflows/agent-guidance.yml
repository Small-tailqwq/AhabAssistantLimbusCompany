name: Agent Guidance

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".agents/**"
      - ".opencode/agents/**"
      - ".opencode/tools/**"
      - ".github/copilot-instructions.md"
      - ".github/workflows/agent-guidance.yml"
      - ".github/workflows/pr-review.yml"
      - ".github/workflows/issue-analyze.yml"
      - "scripts/build_pr_review_context.py"
      - "scripts/check_agent_guidance.py"
      - "scripts/agent_notes.py"
      - "scripts/link_skills.py"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - ".agents/**"
      - ".opencode/agents/**"
      - ".opencode/tools/**"
      - ".github/copilot-instructions.md"
      - ".github/workflows/agent-guidance.yml"
      - ".github/workflows/pr-review.yml"
      - ".github/workflows/issue-analyze.yml"
      - "scripts/build_pr_review_context.py"
      - "scripts/check_agent_guidance.py"
      - "scripts/agent_notes.py"
      - "scripts/link_skills.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate agent guidance
        run: python scripts/check_agent_guidance.py
      - name: Validate Agent Notes
        run: python scripts/agent_notes.py check
        env:
          AGENT_NOTES_BASE_REF: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD' }}
